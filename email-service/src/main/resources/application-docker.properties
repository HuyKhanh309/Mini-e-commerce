spring.application.name=email-service

# Database when running inside Docker network
spring.datasource.url=jdbc:postgresql://postgres:5432/quiz_app
spring.datasource.username=admin
spring.datasource.password=12345678

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
# SMTP (required for JavaMailSender bean)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka (optional if service registers)
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka
eureka.instance.hostname=email-service
eureka.instance.prefer-ip-address=false
