version: "3.8"

services:
  service-registry:
    build: ./service-registry
    image: service-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8765/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      service-registry:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      api-gateway:
        condition: service_healthy

  core-service:
    build: ./core-service
    image: core-service:latest
    container_name: core-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      api-gateway:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: quiz_app
    ports:
      - "5433:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgres-primary/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres-primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgres-primary/init:/docker-entrypoint-initdb.d
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quiz_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  postgres-replica:
    build: ./postgres-replica
    container_name: postgres-replica
    environment:
      POSTGRES_PASSWORD: 12345678
      PGPASSWORD: replpass
    ports:
      - "5434:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:
