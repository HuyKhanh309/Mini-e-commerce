spring.application.name=api-gateway
server.port=8765

# Bật màu log trong terminal (kể cả khi chạy bằng Task)
spring.output.ansi.enabled=always

# Gateway
spring.main.web-application-type=reactive
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Routes tường minh: gọi /api/v1/... sẽ đi tới auth-service (không cần gõ auth-service trong URL)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/**

# Route cho question-service (sẵn sàng khi có API)
spring.cloud.gateway.routes[1].id=question-service
spring.cloud.gateway.routes[1].uri=lb://question-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/questions/**

#Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.leaseRenewalIntervalInSeconds:30
eureka.instance.leaseExpirationDurationInSeconds:90
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

#Logging
logging.level.org.springframework.cloud.gateway= DEBUG

