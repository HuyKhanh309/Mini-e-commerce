spring.application.name=core-service
spring.threads.virtual.enabled=true

# Database when running inside Docker network (primary + slave)
spring.datasource.primary.jdbc-url=jdbc:postgresql://postgres:5432/quiz_app
spring.datasource.primary.username=admin
spring.datasource.primary.password=12345678

spring.datasource.slave.jdbc-url=jdbc:postgresql://postgres-replica:5432/quiz_app
spring.datasource.slave.username=admin
spring.datasource.slave.password=12345678

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Eureka (overridden in docker-compose too, this is a sane default)
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

# Instance identity inside Docker network (visible in Eureka)
eureka.instance.hostname=core-service
eureka.instance.prefer-ip-address=false
