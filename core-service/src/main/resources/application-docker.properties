spring.application.name=core-service
spring.threads.virtual.enabled=true

# Database when running inside Docker network
spring.datasource.url=jdbc:postgresql://postgres:5432/quiz_app
spring.datasource.username=admin
spring.datasource.password=12345678
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Eureka (overridden in docker-compose too, this is a sane default)
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

# Instance identity inside Docker network (visible in Eureka)
eureka.instance.hostname=core-service
eureka.instance.prefer-ip-address=false

app.jwt.secret=${APP_JWT_SECRET}
